<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <title>CacheProxy</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: #0d1117;
                color: #e6edf3;
                min-height: 100vh;
            }
            .header {
                background: #161b22;
                border-bottom: 1px solid #30363d;
                padding: 16px 24px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .header h1 {
                font-size: 20px;
                font-weight: 600;
                color: #f0f6fc;
            }
            .header span {
                color: #8b949e;
                font-size: 14px;
            }
            .container {
                max-width: 100%;
                margin: 0 auto;
                padding: 24px;
            }
            .card {
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 8px;
                padding: 20px;
                margin-bottom: 20px;
            }
            .card h2 {
                font-size: 16px;
                font-weight: 600;
                margin-bottom: 16px;
                color: #f0f6fc;
            }
            .row {
                display: flex;
                gap: 12px;
                margin-bottom: 12px;
                flex-wrap: wrap;
            }
            input,
            select,
            textarea {
                background: #0d1117;
                border: 1px solid #30363d;
                border-radius: 6px;
                padding: 8px 12px;
                color: #e6edf3;
                font-size: 14px;
                flex: 1;
                min-width: 200px;
            }
            input:focus,
            select:focus,
            textarea:focus {
                outline: none;
                border-color: #58a6ff;
            }
            textarea {
                resize: vertical;
                min-height: 60px;
                font-family: inherit;
            }
            button {
                background: #238636;
                color: #fff;
                border: none;
                border-radius: 6px;
                padding: 8px 20px;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                white-space: nowrap;
                transition: background 0.15s;
            }
            button:hover {
                background: #2ea043;
            }
            button:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }
            button:disabled:hover {
                background: #238636;
            }
            button.danger {
                background: #da3633;
            }
            button.danger:hover {
                background: #f85149;
            }
            button.secondary {
                background: #21262d;
                border: 1px solid #30363d;
            }
            button.secondary:hover {
                background: #30363d;
            }
            .tag {
                display: inline-block;
                background: #1f2937;
                color: #58a6ff;
                padding: 2px 8px;
                border-radius: 12px;
                font-size: 12px;
                margin: 2px;
            }
            .result-item {
                border: 1px solid #30363d;
                border-radius: 6px;
                padding: 12px;
                margin-bottom: 8px;
                background: #0d1117;
            }
            .result-item .meta {
                font-size: 12px;
                color: #8b949e;
                margin-bottom: 4px;
            }
            .result-item .score {
                color: #d2a8ff;
                font-weight: 600;
            }
            .result-item .content {
                font-size: 14px;
                line-height: 1.5;
                margin-top: 4px;
            }
            .badge {
                display: inline-block;
                font-size: 11px;
                padding: 2px 8px;
                border-radius: 10px;
                background: #1f2937;
                color: #8b949e;
                margin-left: 6px;
            }
            .badge.project {
                background: #0d419d;
                color: #58a6ff;
            }
            .btn-del {
                cursor: pointer;
                color: #f85149;
                font-size: 12px;
                padding: 2px 8px;
                border-radius: 4px;
                border: 1px solid #f85149;
                background: none;
                transition: background 0.15s;
                white-space: nowrap;
            }
            .btn-del:hover {
                background: #f85149;
                color: #fff;
            }
            .empty {
                color: #8b949e;
                text-align: center;
                padding: 24px;
                font-size: 14px;
            }
            .tabs {
                display: flex;
                gap: 4px;
                margin-bottom: 16px;
            }
            .tab {
                padding: 8px 16px;
                border-radius: 6px 6px 0 0;
                cursor: pointer;
                font-size: 14px;
                background: #0d1117;
                color: #8b949e;
                border: 1px solid #30363d;
                border-bottom: none;
            }
            .tab.active {
                background: #161b22;
                color: #f0f6fc;
                font-weight: 500;
            }
            .tab-content {
                display: none;
            }
            .tab-content.active {
                display: block;
            }
            .log {
                font-size: 12px;
                color: #8b949e;
                margin-top: 8px;
            }
            .log.success {
                color: #3fb950;
            }
            .log.error {
                color: #f85149;
            }
            select {
                cursor: pointer;
            }
            label {
                font-size: 13px;
                color: #8b949e;
                display: block;
                margin-bottom: 4px;
            }
            table.data-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 13px;
            }
            table.data-table th {
                text-align: left;
                padding: 8px 10px;
                background: #21262d;
                color: #8b949e;
                font-weight: 600;
                border-bottom: 1px solid #30363d;
                white-space: nowrap;
                cursor: pointer;
                user-select: none;
                position: sticky;
                top: 0;
            }
            table.data-table th:hover {
                color: #f0f6fc;
            }
            table.data-table td {
                padding: 6px 10px;
                border-bottom: 1px solid #21262d;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            table.data-table tr:hover td {
                background: #1c2128;
            }
            table.data-table .col-title {
                min-width: 200px;
            }
            table.data-table .col-path {
                min-width: 160px;
            }
            .threads-count {
                font-size: 13px;
                color: #8b949e;
                margin-bottom: 12px;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <div><h1>🧠 CacheProxy</h1></div>
            <div style="display:flex;align-items:center;gap:12px">
                <select id="lang-switcher" onchange="switchLang(this.value)" style="font-size:12px;padding:2px 6px;width:auto;min-width:70px">
                    <option value="en">EN</option>
                    <option value="ru">RU</option>
                </select>
            </div>
        </div>

        <div class="container">
            <!-- Tabs -->
            <div class="tabs">
                <div class="tab" onclick="switchTab('search')" data-i18n="tab.search">🔍 Поиск</div>
                <div class="tab active" onclick="switchTab('sessions')" data-i18n="tab.sessions">
                    📁 Сессии
                </div>
                <div class="tab" onclick="switchTab('junk')" data-i18n="tab.junk">🗄️ Zed DB</div>
                <div class="tab" onclick="switchTab('threads')" data-i18n="tab.threads">🧵 Threads</div>
            </div>

            <!-- SEARCH TAB -->
            <div id="tab-search" class="tab-content">
                <div class="card">
                    <h2 data-i18n="search.title">🔍 Семантический поиск</h2>
                    <div class="row">
                        <input
                            id="search-query"
                            data-i18n-placeholder="search.placeholder"
                            placeholder="Что ищем? Например: подвеска для бельгийской трассы"
                            style="flex: 3"
                        />
                        <select id="search-project" style="flex: 1">
                            <option value="" data-i18n="search.filter_all">Все проекты</option>
                        </select>
                        <button onclick="doSearch()" data-i18n="search.btn">🔍 Искать</button>
                    </div>
                </div>
                <div class="card">
                    <h2 data-i18n="search.results_title">Результаты</h2>
                    <div id="search-results">
                        <div class="empty" data-i18n="search.empty_state">
                            Начните поиск — результаты появятся здесь
                        </div>
                    </div>
                </div>
            </div>

            <!-- SESSIONS TAB -->
            <div id="tab-sessions" class="tab-content active">
                <div class="card">
                    <h2 data-i18n="sessions.title">📁 Сессии</h2>
                    <div class="row">
                        <select id="sessions-filter" style="max-width: 200px">
                            <option value="" data-i18n="sessions.filter_all">Все проекты</option>
                        </select>
                        <select
                            id="sessions-status"
                            style="max-width: 140px"
                            onchange="loadSessions()"
                        >
                            <option value="" data-i18n="sessions.status_all">Все статусы</option>
                            <option value="active" data-i18n="sessions.active">🟢 Активные</option>
                            <option value="archived" data-i18n="sessions.archived">📦 Архивные</option>
                        </select>
                        <button onclick="loadSessions()" data-i18n="sessions.refresh">🔄 Обновить</button>
                    </div>
                </div>
                <div class="card">
                    <div id="sessions-list">
                        <div class="empty" data-i18n="sessions.empty">Нет сессий</div>
                    </div>
                </div>

                <!-- ADMIN PANEL -->
                <div class="card">
                    <h2 data-i18n="admin.title">🔧 Управление</h2>

                    <div style="margin-bottom: 12px">
                        <label data-i18n="admin.projects">Проекты для загрузки</label>
                        <div
                            id="project-list"
                            style="
                                display: flex;
                                flex-wrap: wrap;
                                gap: 6px;
                                margin-top: 4px;
                            "
                        >
                            <span class="empty" style="padding: 4px 8px"
                                data-i18n="admin.loading">Загрузка...</span
                            >
                        </div>
                        <div style="margin-top: 4px; display: flex; gap: 8px">
                            <button
                                class="secondary"
                                onclick="selectAllProjects(true)"
                                style="font-size: 12px; padding: 2px 8px"
                                data-i18n="common.select_all"
                            >
                                Выбрать все
                            </button>
                            <button
                                class="secondary"
                                onclick="selectAllProjects(false)"
                                style="font-size: 12px; padding: 2px 8px"
                                data-i18n="common.deselect_all"
                            >
                                Снять все
                            </button>
                        </div>
                    </div>

                    <div class="row" style="flex-wrap: wrap; gap: 8px">
                        <button id="btn-sync" onclick="runSync()" data-i18n="admin.sync">
                            🔄 Sync выбранные
                        </button>
                        <button id="btn-clean" onclick="cleanSelected()" data-i18n="admin.clean">
                            🧹 Очистить выбранные
                        </button>
                        <button id="btn-daemon" onclick="toggleDaemon()" data-i18n="admin.daemon_off">
                            ▶️ Демон
                        </button>
                        <button onclick="resummarizeAll()" data-i18n="admin.resummarize">📝 Ресаммари</button>
                    </div>
                    <div class="row" style="flex-wrap: wrap; gap: 8px; margin-top: 4px">
                        <button class="danger" onclick="resetDb()" data-i18n="admin.db_reset" style="opacity:0.6;font-size:12px;padding:4px 12px">
                            🗑️ DB Reset
                        </button>
                    </div>
                    <div
                        id="admin-log"
                        class="log"
                        style="margin-top: 8px"
                    ></div>
                </div>
            </div>

            <!-- JUNK TAB -->
            <div id="tab-junk" class="tab-content">
                <div class="card">
                    <h2 data-i18n="junk.title">🗑️ Все треды Zed (сырые, без фильтрации)</h2>
                    <div class="row">
                        <select id="junk-filter" style="max-width: 200px">
                            <option value="" data-i18n="junk.filter_all">Все проекты</option>
                        </select>
                        <select
                            id="junk-status"
                            style="max-width: 160px"
                            onchange="loadJunk()"
                        >
                            <option value="" data-i18n="junk.status_all">Все статусы</option>
                            <option value="archived" data-i18n="junk.archived">📦 Архивные</option>
                            <option value="active" data-i18n="junk.active">🟢 Активные</option>
                            <option value="broken" data-i18n="junk.broken">💥 С ошибками</option>
                        </select>
                        <button onclick="loadJunk()" data-i18n="junk.refresh">🔄 Обновить</button>
                    </div>
                    <div id="junk-stats" style="font-size:13px;color:#8b949e;margin-bottom:12px"></div>
                    <div id="junk-list">
                        <div class="empty" data-i18n="junk.empty">Нет тредов</div>
                    </div>
                </div>
            </div>

            <!-- THREADS TAB -->
            <div id="tab-threads" class="tab-content">
                <div class="card">
                    <h2 data-i18n="threads.title">🧵 sidebar_threads (db.sqlite)</h2>
                    <div class="row">
                        <input
                            id="threads-filter"
                            data-i18n-placeholder="threads.filter"
                            placeholder="Фильтр по title/folder/project"
                            style="max-width: 250px"
                        />
                        <span
                            id="threads-stats"
                            style="
                                font-size: 13px;
                                color: #8b949e;
                                align-self: center;
                            "
                        ></span>
                        <button onclick="loadSidebarThreads()" data-i18n="threads.refresh">🔄 Обновить</button>
                    </div>
                    <div id="threads-list">
                        <div class="empty" data-i18n="threads.empty_state">Нажмите Refresh для загрузки</div>
                    </div>
                </div>
            </div>
        </div>

            let currentLang = (() => {
                try {
                    const s = localStorage.getItem('cacheproxy_lang');
                    if (s === 'en' || s === 'ru') return s;
                } catch(e) {}
                return navigator.language?.startsWith('ru') ? 'ru' : 'en';
            })();

            function __(key, params) {
                let s = (LANG[currentLang] && LANG[currentLang][key]);
                if (!s) s = LANG['en'][key] || key;
                if (!params) return s;
                Object.keys(params).forEach(k => {
                    s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]);
                });
                return s;
            }

                });
                document.querySelectorAll('[data-i18n-value]').forEach(el => {
                    el.value = __(el.dataset.i18nValue);
                });
                document.documentElement.lang = currentLang;
                const sw = $('lang-switcher');
                if (sw) sw.value = currentLang;
            }

            async function checkDaemonStatus() {
                try {
                    const r = await fetch(`${BASE}/admin/daemon/status`);
                    const data = await r.json();
                    daemonRunning = data.running;
                    const btn = $("btn-daemon");
                    btn.textContent = daemonRunning

            async function runSync() {
                const btn = $("btn-sync");
                const selected = getSelectedProjects();

                // If no projects at all — auto-sync everything
                if (selected.length === 0 && availableProjects.length > 0) {
                    log(
                        $("admin-log"),
                        __('admin.select_project'),
                        "error",
                    );
                    return;
                }

                btn.disabled = true;
                btn.textContent = __('admin.syncing');
                try {
                    let url = `${BASE}/admin/sync`;
                    if (
                        selected.length > 0 &&
                        selected.length < availableProjects.length
                    ) {
                        url += `?projects=${encodeURIComponent(selected.join(","))}`;
                    }
                    await fetch(url, { method: "POST" });

                    let done = false;
                    let lastResult = null;
                    let pollAttempts = 0;
                    while (!done) {
                        await new Promise((r) => setTimeout(r, 1000));
                        const sr = await fetch(`${BASE}/admin/sync/status`);
                        const st = await sr.json();
                        btn.textContent = st.running
                            ? `⏳ ${st.progress}`
                            : __('admin.finishing');
                        if (!st.running) {
                            if (st.last_result) {
                                lastResult = st.last_result;
                            } else if (st.progress?.startsWith("Done")) {
                                lastResult = st;
                            } else if (st.progress?.startsWith("Error")) {
                                lastResult = {
                                    synced: 0,
                                    total: 0,
                                    errors: [st.progress],
                                };
                            } else {
                                lastResult = {
                                    synced: 0,
                                    total: 0,
                                    errors: [st.progress || "Unknown"],
                                };
                            }
                            done = true;
                        }
                        pollAttempts++;
                        if (pollAttempts > 600) {
                            done = true;
                            lastResult = {
                                synced: 0,
                                total: 0,
                                errors: ["Timeout: sync took too long"],
                            };
                        }
                    }

                    const r2 = lastResult || { synced: 0, total: 0, errors: [] };
                    log(
                        $("admin-log"),
                        __('admin.sync_done', { synced: r2.synced, total: r2.total }),
                        "success",
                    );
                    if (r2.errors?.length) {
                        log(
                            $("admin-log"),
                            __('admin.sync_errors', { count: r2.errors.length, details: r2.errors.join("; ") }),
                            "error",
                        );
                    }
                    loadProjects();
                    loadSessions();
                } catch (e) {
                    log($("admin-log"), __('common.error', { msg: e.message }), "error");
                } finally {
                    btn.disabled = false;
                    btn.textContent = __('admin.sync');
                }
            }

            async function cleanSelected() {
                const btn = $("btn-clean");
                const selected = getSelectedProjects();

                if (selected.length === 0 && availableProjects.length > 0) {
                    log($("admin-log"), "⚠️ Выбери хотя бы один проект", "error");
                    return;
                }

                btn.disabled = true;
                btn.textContent = __('admin.cleaning');
                log($("admin-log"), __('admin.clean_log'), "info");

                try {
                    const r = await fetch(`${BASE}/admin/zed-threads`);
                    const data = await r.json();
                    let projectFilter = selected.length > 0 ? selected : availableProjects;
                    let threads = data.threads.filter(t => projectFilter.includes(t.project));

                    let totalStats = { thinking_removed: 0, tooluse_removed: 0, mention_removed: 0, image_removed: 0 };
                    let cleaned = 0;
                    let errors = [];

                    for (const t of threads) {
                        try {
                            const r2 = await fetch(`${BASE}/admin/zed-threads/${t.id}/clean`, { method: "POST" });
                            if (r2.ok) {
                                const stats = await r2.json();
                                totalStats.thinking_removed += stats.thinking_removed || 0;
                                totalStats.tooluse_removed += stats.tooluse_removed || 0;
                                totalStats.mention_removed += stats.mention_removed || 0;
                                totalStats.image_removed += stats.image_removed || 0;
                                cleaned++;
                            } else {
                                errors.push(t.title);
                            }
                        } catch (e) {
                            errors.push(t.title);
                        }
                    }

                    log($("admin-log"),
                        __('admin.clean_done', { count: cleaned, t: totalStats.thinking_removed, tu: totalStats.tooluse_removed, m: totalStats.mention_removed, i: totalStats.image_removed }),
                        "success");
                    if (errors.length) {
                        log($("admin-log"), __('admin.clean_errors', { count: errors.length, details: errors.join(", ") }), "error");
                    }
                } catch (e) {
                    log($("admin-log"), __('admin.clean_err', { msg: e.message }), "error");
                } finally {
                    btn.disabled = false;
                    btn.textContent = __('admin.clean');
                }
            }

                return str.slice(0, max) + "...";

            function _snippetMatch(text, query) {
                if (!text) return "";

            async function doSearch() {
                const query = $("search-query").value.trim();
                const project = $("search-project").value.trim();

                const params = new URLSearchParams({ query, limit: 10 });
                if (project) params.set("project", project);

                try {
                    const r = await fetch(`${BASE}/context/search?${params}`);

                        container.innerHTML =

                        return;

                            ? "👤"

                              ? "🤖"

                container.innerHTML = html;
            }

            function escapeHtml(str) {
                const div = document.createElement("div");
                div.textContent = str;
                return div.innerHTML;
            }

            // ─── JUNK (raw Zed threads) ──────────────────────────────

            function formatBytes(bytes) {
                if (!bytes || bytes === 0) return "0 B";
                const units = ["B", "KB", "MB", "GB"];
                let i = 0;
                let size = bytes;
                while (size >= 1024 && i < units.length - 1) {
                    size /= 1024;
                    i++;
                }
                return size.toFixed(1) + " " + units[i];
            }

            function formatDate(str) {
                if (!str) return "—";
                return new Date(str).toLocaleDateString(currentLang === "ru" ? "ru" : "en-US");
            }

            let _junkThreads = [];

            async function loadJunk() {
                const project = $("junk-filter").value.trim().toLowerCase();
                const status = $("junk-status").value;
                const container = $("junk-list");

                try {
                    const r = await fetch(`${BASE}/admin/zed-threads`);
                    const data = await r.json();
                    _junkThreads = data.threads;

                    // Stats bar
                    let statsHtml = __('junk.stats', { total: data.total, msgs: data.total_messages }) + ' ';
                    statsHtml += `${data.archived_count}📦 ${data.active_count}🟢 · `;
                    statsHtml += __('junk.compressed', { size: formatBytes(data.total_compressed_mb * 1024 * 1024) });
                    if (data.total_decompressed_mb) {
                        statsHtml += __('junk.decompressed', { size: formatBytes(data.total_decompressed_mb * 1024 * 1024) });
                    }
                    $("junk-stats").textContent = statsHtml;

                    // Filter
                    let filtered = _junkThreads;
                    if (project) {
                        filtered = filtered.filter((t) =>
                            t.project.toLowerCase() === project,
                        );
                    }
                    if (status === "archived") {
                        filtered = filtered.filter((t) => t.archived);
                    } else if (status === "active") {
                        filtered = filtered.filter((t) => !t.archived);
                    } else if (status === "broken") {
                        filtered = filtered.filter((t) => t.error);
                    }

                    if (filtered.length === 0) {
                        container.innerHTML =
                            `<div class="empty">${__('junk.empty')}</div>`;
                        return;
                    }

                    container.innerHTML = `<div style="font-size:13px;color:#8b949e;margin-bottom:12px">${__('junk.shown', { shown: filtered.length, total: data.total })}</div>`;

                    filtered.forEach((t) => {
                        const statusIcon = t.archived ? "📦" : "🟢";
                        const errorBadge = t.error
                            ? `<span class="badge" style="background:#da3633;color:#fff" title="${escapeHtml(t.error)}">💥</span>`
                            : "";
                        const sizeInfo =
                            __('junk.compressed', { size: formatBytes(t.compressed_bytes) }) +
                            (t.decompressed_bytes
                                ? __('junk.decompressed', { size: formatBytes(t.decompressed_bytes) })
                                : "");

                        container.innerHTML += `
        <div class="result-item" id="junk-${t.id}">
          <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="showJunkThread('${t.id}')">
            <div style="flex:1;cursor:pointer" onclick="showJunkThread('${t.id}')">
              <strong>${escapeHtml(t.title || "(без названия)")}</strong>
              <span class="badge project">${escapeHtml(t.project)}</span>
              <span style="font-size:12px;color:#8b949e;margin-left:12px">${t.message_count} сообщ.</span>
              <span style="font-size:12px;color:#8b949e;margin-left:8px">${sizeInfo}</span>
              <span style="font-size:12px;margin-left:8px">${statusIcon}</span>
              ${errorBadge}
            </div>
          </div>
        </div>`;
                    });
                } catch (e) {
                    container.innerHTML = `<div class="empty" style="color:#f85149">Ошибка: ${e.message}</div>`;
                }
            }

            async function showJunkThread(sid) {
                // Find thread data
                const t = _junkThreads.find((x) => x.id === sid);
                if (!t) return;
                const container = $("junk-list");

                let html = `<button class="secondary" onclick="loadJunk()" style="margin-bottom:12px">${__('junk.back')}</button>
    <div style="font-size:13px;color:#8b949e;margin-bottom:12px">
      <strong>${escapeHtml(t.title || __('junk.no_title'))}</strong>
      <span class="badge project">${escapeHtml(t.project)}</span>
      · ${__('junk.raw_msgs', { count: t.message_count })} · ${formatBytes(t.compressed_bytes)}
      ${t.error ? `· 💥 ${escapeHtml(t.error)}` : ""}
    </div>
    <div style="font-size:12px;color:#8b949e;margin-bottom:12px">${__('junk.warning')}</div>
    <button onclick="cleanJunkThread('${sid}')" style="font-size:13px;margin-bottom:12px">${__('junk.clean_btn')}</button>
    <span id="junk-clean-status-${sid}" style="font-size:12px;color:#8b949e;margin-left:8px"></span>`;

                if (t.error) {
                    html += `<div class="result-item"><div class="content" style="color:#f85149">${__('junk.err_decompress', { error: escapeHtml(t.error) })}</div></div>`;
                    container.innerHTML = html;
                    return;
                }

                // Fetch RAW messages directly from Zed via the backend
                try {
                    const r = await fetch(
                        `${BASE}/admin/zed-threads/${sid}/messages`,
                    );
                    if (r.ok) {
                        const data = await r.json();
                        const msgs = data.messages;
                        html += `<div style="font-size:13px;color:#8b949e;margin-bottom:12px">${__('junk.raw_msgs', { count: msgs.length })}</div>`;

                        // Re-fetch messages after potential clean
                        const msgList = msgs;
                        msgs.slice().reverse().forEach((m, i) => {
                            const icon =
                                m.role === "user"
                                    ? "👤"
                                    : m.role === "assistant"
                                      ? "🤖"
                                      : "⚙️";
                            const blocks = m.blocks ? m.blocks.join(" | ") : "";
                            html += `
      <div class="result-item">
        <div class="meta">${icon} ${m.role} · #${i + 1} ${blocks ? `· [${escapeHtml(blocks)}]` : ""}</div>
        <div class="content" style="${m.has_thinking ? "border-left:3px solid #d29922;padding-left:8px" : ""}">${escapeHtml(m.content)}</div>
      </div>`;
                        });
                    }
                } catch (e) {
                    html += `<div class="result-item"><div class="content" style="color:#f85149">${__('common.error', { msg: escapeHtml(e.message) })}</div></div>`;
                }

                container.innerHTML = html;
            }

            async function syncJunkThread(sid) {
                const btn = document.querySelector(
                    `button[onclick="syncJunkThread('${sid}')"]`,
                );
                const statusEl = $(`junk-sync-status-${sid}`);
                if (btn) {
                    btn.disabled = true;
                    btn.textContent = "⏳ Синхронизация...";
                }
                statusEl.textContent = "⏳";
                try {
                    const r = await fetch(
                        `${BASE}/admin/zed-threads/${sid}/sync`,
                        { method: "POST" },
                    );
                    const data = await r.json();
                    if (r.ok) {
                        statusEl.textContent = __('common.synced_ok', { count: data.messages });
                        if (btn) btn.textContent = "✅ Готово";
                    } else {
                        statusEl.textContent = __('junk.clean_err', { msg: data.detail || "Error" });
                        if (btn) {
                            btn.disabled = false;
                            btn.textContent =
                                "📥 Синхронизировать в CacheProxy";
                        }
                    }
                } catch (e) {
                    statusEl.textContent = __('common.error', { msg: e.message });
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = "📥 Синхронизировать в CacheProxy";
                    }
                }
            }

            async function cleanJunkThread(sid) {
                const statusEl = $(`junk-clean-status-${sid}`);
                statusEl.textContent = "⏳ Очистка...";
                try {
                    const r = await fetch(
                        `${BASE}/admin/zed-threads/${sid}/clean`,
                        { method: "POST" },
                    );
                    const data = await r.json();
                    if (r.ok) {
                        statusEl.textContent = __('junk.clean_done', { t: data.thinking_removed, tu: data.tooluse_removed, m: data.mention_removed, i: data.image_removed });
                        // Reload the thread to show cleaned messages
                        showJunkThread(sid);
                    } else {
                        statusEl.textContent = __('junk.clean_err', { msg: data.detail || "Error" });
                    }
                } catch (e) {
                    statusEl.textContent = __('common.error', { msg: e.message });
                }
            }

            // ─── THREADS (sidebar_threads from db.sqlite) ───────────

            let _sidebarThreads = [];
            let _threadsSortCol = null;
            let _threadsSortAsc = true;

            async function loadSidebarThreads() {
                const filter = $("threads-filter").value.trim().toLowerCase();
                const container = $("threads-list");

                try {
                    const r = await fetch(`${BASE}/admin/sidebar-threads`);
                    if (!r.ok) {
                        const err = await r.json();
                        container.innerHTML = `<div class="empty" style="color:#f85149">${__('common.error', { msg: escapeHtml(err.detail || r.statusText) })}</div>`;
                        return;
                    }
                    const data = await r.json();
                    _sidebarThreads = data.threads;

                    $("threads-stats").textContent = __('threads.stats', { total: data.total });

                    // Filter
                    let filtered = _sidebarThreads;
                    if (filter) {
                        filtered = filtered.filter(
                            (t) =>
                                (t.title || "")
                                    .toLowerCase()
                                    .includes(filter) ||
                                (t.folder_paths || "")
                                    .toLowerCase()
                                    .includes(filter) ||
                                (t.session_id || "")
                                    .toLowerCase()
                                    .includes(filter),
                        );
                    }

                    if (filtered.length === 0) {
                        container.innerHTML =
                            `<div class="empty">${__('threads.empty')}</div>`;
                        return;
                    }

                    // Sort
                    if (_threadsSortCol) {
                        filtered.sort((a, b) => {
                            const va = (a[_threadsSortCol] || "").toString();
                            const vb = (b[_threadsSortCol] || "").toString();
                            const cmp = va.localeCompare(vb);
                            return _threadsSortAsc ? cmp : -cmp;
                        });
                    }

                    let html = `<div class="threads-count">${__('threads.shown', { shown: filtered.length, total: data.total })}</div>`;
                    html += `<table class="data-table">`;

                    // Header
                    const columns = [
                        { key: "title", label: "Title" },
                        { key: "session_id", label: "Session ID" },
                        { key: "folder_paths", label: "Folder" },
                        { key: "archived", label: "Arch" },
                        { key: "interacted_at", label: "Interacted" },
                        { key: "updated_at", label: "Updated" },
                        { key: "created_at", label: "Created" },
                        { key: "remote_connection", label: "Remote" },
                        { key: "title_override", label: "Title Ovrd" },
                    ];

                    html += "<tr>";
                    columns.forEach((col) => {
                        const arrow =
                            _threadsSortCol === col.key
                                ? _threadsSortAsc
                                    ? " ▲"
                                    : " ▼"
                                : "";
                        html += `<th onclick="sortThreads('${col.key}')">${col.label}${arrow}</th>`;
                    });
                    html += "</tr>";

                    // Body
                    filtered.forEach((t) => {
                        const archived =
                            t.archived === 1
                                ? "📦"
                                : t.archived === 0
                                  ? "🟢"
                                  : "—";
                        html += `<tr>`;
                        html += `<td class="col-title" title="${escapeHtml(t.title || "")}">${escapeHtml(t.title || "—")}</td>`;
                        html += `<td style="font-family:monospace;font-size:12px" title="${escapeHtml(t.session_id || "")}">${escapeHtml(t.session_id || "—")}</td>`;
                        html += `<td class="col-path" title="${escapeHtml(t.folder_paths || "")}">${escapeHtml(t.folder_paths || "—")}</td>`;
                        html += `<td>${archived}</td>`;
                        html += `<td>${formatDate(t.interacted_at)}</td>`;
                        html += `<td>${formatDate(t.updated_at)}</td>`;
                        html += `<td>${formatDate(t.created_at)}</td>`;
                        html += `<td>${escapeHtml(t.remote_connection || "—")}</td>`;
                        html += `<td>${escapeHtml(t.title_override || "—")}</td>`;
                        html += `</tr>`;
                    });

                    html += "</table>";
                    container.innerHTML = html;
                } catch (e) {
                    container.innerHTML = `<div class="empty" style="color:#f85149">${__('common.error', { msg: escapeHtml(e.message) })}</div>`;
                }
            }

            function sortThreads(col) {
                if (_threadsSortCol === col) {
                    _threadsSortAsc = !_threadsSortAsc;
                } else {
                    _threadsSortCol = col;
                    _threadsSortAsc = true;
                }
                loadSidebarThreads();
            }

            // ─── INIT ────────────────────────────────────────────────

            // Init: load sessions + projects + daemon status
            setTimeout(() => {
                localizePage();
                loadSessions();
                loadProjects();
                checkDaemonStatus();
            }, 500);

            // Fetch project names for search
            fetch(`${BASE}/sessions`)
                .then((r) => r.json())
                .then((data) => {
                    window._sessions = {};
                    data.sessions.forEach((s) => {
                        window._sessions[s.id] = s.project || "—";
                    });
                })
                .catch(() => {});
        </script>
    </body>
</html>
