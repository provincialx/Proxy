<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CacheProxy</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: #0d1117;
                color: #e6edf3;
                min-height: 100vh;
            }
            .header {
                background: #161b22;
                border-bottom: 1px solid #30363d;
                padding: 16px 24px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .header h1 {
                font-size: 20px;
                font-weight: 600;
                color: #f0f6fc;
            }
            .header span {
                color: #8b949e;
                font-size: 14px;
            }
            .container {
                max-width: 960px;
                margin: 0 auto;
                padding: 24px;
            }
            .card {
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 8px;
                padding: 20px;
                margin-bottom: 20px;
            }
            .card h2 {
                font-size: 16px;
                font-weight: 600;
                margin-bottom: 16px;
                color: #f0f6fc;
            }
            .row {
                display: flex;
                gap: 12px;
                margin-bottom: 12px;
                flex-wrap: wrap;
            }
            input,
            select,
            textarea {
                background: #0d1117;
                border: 1px solid #30363d;
                border-radius: 6px;
                padding: 8px 12px;
                color: #e6edf3;
                font-size: 14px;
                flex: 1;
                min-width: 200px;
            }
            input:focus,
            select:focus,
            textarea:focus {
                outline: none;
                border-color: #58a6ff;
            }
            textarea {
                resize: vertical;
                min-height: 60px;
                font-family: inherit;
            }
            button {
                background: #238636;
                color: #fff;
                border: none;
                border-radius: 6px;
                padding: 8px 20px;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                white-space: nowrap;
                transition: background 0.15s;
            }
            button:hover {
                background: #2ea043;
            }
            button:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }
            button:disabled:hover {
                background: #238636;
            }
            button.danger {
                background: #da3633;
            }
            button.danger:hover {
                background: #f85149;
            }
            button.secondary {
                background: #21262d;
                border: 1px solid #30363d;
            }
            button.secondary:hover {
                background: #30363d;
            }
            .tag {
                display: inline-block;
                background: #1f2937;
                color: #58a6ff;
                padding: 2px 8px;
                border-radius: 12px;
                font-size: 12px;
                margin: 2px;
            }
            .result-item {
                border: 1px solid #30363d;
                border-radius: 6px;
                padding: 12px;
                margin-bottom: 8px;
                background: #0d1117;
            }
            .result-item .meta {
                font-size: 12px;
                color: #8b949e;
                margin-bottom: 4px;
            }
            .result-item .score {
                color: #d2a8ff;
                font-weight: 600;
            }
            .result-item .content {
                font-size: 14px;
                line-height: 1.5;
                margin-top: 4px;
            }
            .badge {
                display: inline-block;
                font-size: 11px;
                padding: 2px 8px;
                border-radius: 10px;
                background: #1f2937;
                color: #8b949e;
                margin-left: 6px;
            }
            .badge.project {
                background: #0d419d;
                color: #58a6ff;
            }
            .btn-del {
                cursor: pointer;
                color: #f85149;
                font-size: 12px;
                padding: 2px 8px;
                border-radius: 4px;
                border: 1px solid #f85149;
                background: none;
                transition: background 0.15s;
                white-space: nowrap;
            }
            .btn-del:hover {
                background: #f85149;
                color: #fff;
            }
            .empty {
                color: #8b949e;
                text-align: center;
                padding: 24px;
                font-size: 14px;
            }
            .tabs {
                display: flex;
                gap: 4px;
                margin-bottom: 16px;
            }
            .tab {
                padding: 8px 16px;
                border-radius: 6px 6px 0 0;
                cursor: pointer;
                font-size: 14px;
                background: #0d1117;
                color: #8b949e;
                border: 1px solid #30363d;
                border-bottom: none;
            }
            .tab.active {
                background: #161b22;
                color: #f0f6fc;
                font-weight: 500;
            }
            .tab-content {
                display: none;
            }
            .tab-content.active {
                display: block;
            }
            .log {
                font-size: 12px;
                color: #8b949e;
                margin-top: 8px;
            }
            .log.success {
                color: #3fb950;
            }
            .log.error {
                color: #f85149;
            }
            select {
                cursor: pointer;
            }
            label {
                font-size: 13px;
                color: #8b949e;
                display: block;
                margin-bottom: 4px;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <div><h1>🧠 CacheProxy</h1></div>
            <span>Кеширование контекста чатов</span>
        </div>

        <div class="container">
            <!-- Tabs -->
            <div class="tabs">
                <div class="tab" onclick="switchTab('search')">🔍 Поиск</div>
                <div class="tab active" onclick="switchTab('sessions')">
                    📁 Сессии
                </div>
                <div class="tab" onclick="switchTab('junk')">🗑️ Junk</div>
            </div>

            <!-- SEARCH TAB -->
            <div id="tab-search" class="tab-content">
                <div class="card">
                    <h2>🔍 Семантический поиск</h2>
                    <div class="row">
                        <input
                            id="search-query"
                            placeholder="Что ищем? Например: подвеска для бельгийской трассы"
                            style="flex: 3"
                        />
                        <input
                            id="search-project"
                            placeholder="Проект (оставь пустым — все)"
                            style="flex: 1"
                        />
                        <button onclick="doSearch()">🔍 Искать</button>
                    </div>
                </div>
                <div class="card">
                    <h2>Результаты</h2>
                    <div id="search-results">
                        <div class="empty">
                            Начните поиск — результаты появятся здесь
                        </div>
                    </div>
                </div>
            </div>

            <!-- SESSIONS TAB -->
            <div id="tab-sessions" class="tab-content active">
                <div class="card">
                    <h2>📁 Сессии</h2>
                    <div class="row">
                        <input
                            id="sessions-filter"
                            placeholder="Фильтр по проекту"
                            style="max-width: 200px"
                        />
                        <select
                            id="sessions-status"
                            style="max-width: 140px"
                            onchange="loadSessions()"
                        >
                            <option value="">Все статусы</option>
                            <option value="active">🟢 Активные</option>
                            <option value="archived">📦 Архивные</option>
                        </select>
                        <button onclick="loadSessions()">🔄 Обновить</button>
                    </div>
                </div>
                <div class="card">
                    <div id="sessions-list">
                        <div class="empty">Загрузите список сессий</div>
                    </div>
                </div>

                <!-- ADMIN PANEL -->
                <div class="card">
                    <h2>🔧 Управление</h2>

                    <div style="margin-bottom: 12px">
                        <label>Проекты для загрузки</label>
                        <div
                            id="project-list"
                            style="
                                display: flex;
                                flex-wrap: wrap;
                                gap: 6px;
                                margin-top: 4px;
                            "
                        >
                            <span class="empty" style="padding: 4px 8px"
                                >Загрузка...</span
                            >
                        </div>
                        <div style="margin-top: 4px; display: flex; gap: 8px">
                            <button
                                class="secondary"
                                onclick="selectAllProjects(true)"
                                style="font-size: 12px; padding: 2px 8px"
                            >
                                Выбрать все
                            </button>
                            <button
                                class="secondary"
                                onclick="selectAllProjects(false)"
                                style="font-size: 12px; padding: 2px 8px"
                            >
                                Снять все
                            </button>
                        </div>
                    </div>

                    <div class="row" style="flex-wrap: wrap; gap: 8px">
                        <button id="btn-sync" onclick="runSync()">
                            🔄 Sync выбранные
                        </button>
                        <button id="btn-daemon" onclick="toggleDaemon()">
                            ▶️ Демон
                        </button>
                        <button class="danger" onclick="resetDb()">
                            🗑️ DB Reset
                        </button>
                        <button onclick="resummarizeAll()">📝 Ресаммари</button>
                    </div>
                    <div
                        id="admin-log"
                        class="log"
                        style="margin-top: 8px"
                    ></div>
                </div>
            </div>

            <!-- JUNK TAB -->
            <div id="tab-junk" class="tab-content">
                <div class="card">
                    <h2>🗑️ Все треды Zed (сырые, без фильтрации)</h2>
                    <div class="row">
                        <input
                            id="junk-filter"
                            placeholder="Фильтр по проекту"
                            style="max-width: 200px"
                        />
                        <select
                            id="junk-status"
                            style="max-width: 160px"
                            onchange="loadJunk()"
                        >
                            <option value="">Все статусы</option>
                            <option value="archived">📦 Архивные</option>
                            <option value="active">🟢 Активные</option>
                            <option value="broken">💥 С ошибками</option>
                        </select>
                        <span
                            id="junk-stats"
                            style="
                                font-size: 13px;
                                color: #8b949e;
                                align-self: center;
                            "
                        ></span>
                        <button onclick="loadJunk()">🔄 Обновить</button>
                    </div>
                </div>
                <div class="card">
                    <div id="junk-list">
                        <div class="empty">Загрузите список тредов</div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            const BASE = "";

            function $(id) {
                return document.getElementById(id);
            }

            function switchTab(name) {
                document
                    .querySelectorAll(".tab")
                    .forEach((t) => t.classList.remove("active"));
                document
                    .querySelectorAll(".tab-content")
                    .forEach((t) => t.classList.remove("active"));
                document
                    .querySelector(`.tab[onclick*="${name}"]`)
                    .classList.add("active");
                $(`tab-${name}`).classList.add("active");
                if (name === "sessions") loadSessions();
                if (name === "search") doSearch();
                if (name === "junk") loadJunk();
            }

            function log(el, msg, type = "") {
                el.innerHTML = `<span class="${type}">${msg}</span>`;
                setTimeout(() => {
                    if (el.innerHTML === `<span class="${type}">${msg}</span>`)
                        el.innerHTML = "";
                }, 4000);
            }

            // ─── ADMIN: PROJECTS + SYNC + DAEMON + DB RESET ─────

            let daemonRunning = false;
            let availableProjects = [];

            async function loadProjects() {
                try {
                    const r = await fetch(`${BASE}/admin/projects`);
                    const data = await r.json();
                    availableProjects = data.projects;
                    const container = $("project-list");
                    if (data.projects.length === 0) {
                        container.innerHTML =
                            '<span class="empty" style="padding: 4px 8px">Нет архивированных тредов</span>';
                        return;
                    }
                    container.innerHTML = data.projects
                        .map(
                            (p) =>
                                `<label style="display:flex;align-items:center;gap:4px;cursor:pointer;background:#21262d;padding:4px 10px;border-radius:6px;font-size:13px">
                        <input type="checkbox" checked value="${escapeHtml(p)}" onchange="onProjectChange()">
                        ${escapeHtml(p)}
                      </label>`,
                        )
                        .join("");
                } catch (e) {
                    $("project-list").innerHTML =
                        '<span class="empty" style="padding:4px 8px;color:#f85149">Ошибка загрузки проектов</span>';
                }
            }

            function onProjectChange() {
                // just re-read checkboxes on sync
            }

            function getSelectedProjects() {
                const checks = document.querySelectorAll(
                    "#project-list input[type=checkbox]",
                );
                const selected = [];
                checks.forEach((c) => {
                    if (c.checked) selected.push(c.value);
                });
                return selected;
            }

            function selectAllProjects(select) {
                document
                    .querySelectorAll("#project-list input[type=checkbox]")
                    .forEach((c) => (c.checked = select));
            }

            async function checkDaemonStatus() {
                try {
                    const r = await fetch(`${BASE}/admin/daemon/status`);
                    const data = await r.json();
                    daemonRunning = data.running;
                    const btn = $("btn-daemon");
                    btn.textContent = daemonRunning
                        ? "⏹️ Остановить демона"
                        : "▶️ Запустить демона";
                    btn.className = daemonRunning ? "danger" : "";
                } catch (e) {}
            }

            async function runSync() {
                const btn = $("btn-sync");
                const selected = getSelectedProjects();

                // If no projects at all — auto-sync everything
                if (selected.length === 0 && availableProjects.length > 0) {
                    log(
                        $("admin-log"),
                        "⚠️ Выбери хотя бы один проект",
                        "error",
                    );
                    return;
                }

                btn.disabled = true;
                btn.textContent = "⏳ Синхронизация...";
                try {
                    let url = `${BASE}/admin/sync`;
                    // Pass selected projects only if some are unselected
                    if (
                        selected.length > 0 &&
                        selected.length < availableProjects.length
                    ) {
                        url += `?projects=${encodeURIComponent(selected.join(","))}`;
                    }
                    // POST starts async sync
                    await fetch(url, { method: "POST" });

                    // Poll sync status until done
                    let done = false;
                    let lastResult = null;
                    let pollAttempts = 0;
                    while (!done) {
                        await new Promise((r) => setTimeout(r, 1000));
                        const sr = await fetch(`${BASE}/admin/sync/status`);
                        const st = await sr.json();
                        btn.textContent = st.running
                            ? `⏳ ${st.progress}`
                            : `⏳ Завершение...`;
                        if (!st.running) {
                            if (st.last_result) {
                                lastResult = st.last_result;
                            } else if (st.progress?.startsWith("Done")) {
                                lastResult = st;
                            } else if (st.progress?.startsWith("Error")) {
                                lastResult = {
                                    synced: 0,
                                    total: 0,
                                    errors: [st.progress],
                                };
                            } else {
                                lastResult = {
                                    synced: 0,
                                    total: 0,
                                    errors: [st.progress || "Unknown"],
                                };
                            }
                            done = true;
                        }
                        pollAttempts++;
                        if (pollAttempts > 600) {
                            // 10 min timeout
                            done = true;
                            lastResult = {
                                synced: 0,
                                total: 0,
                                errors: ["Timeout: sync took too long"],
                            };
                        }
                    }

                    const r2 = lastResult || {
                        synced: 0,
                        total: 0,
                        errors: [],
                    };
                    log(
                        $("admin-log"),
                        `✅ Синхронизировано ${r2.synced} из ${r2.total} тредов`,
                        "success",
                    );
                    if (r2.errors?.length) {
                        log(
                            $("admin-log"),
                            `⚠️ ${r2.errors.length} ошибок`,
                            "error",
                        );
                    }
                    loadProjects();
                    loadSessions();
                } catch (e) {
                    log($("admin-log"), `❌ Ошибка: ${e.message}`, "error");
                } finally {
                    btn.disabled = false;
                    btn.textContent = "🔄 Sync выбранные";
                }
            }

            async function toggleDaemon() {
                try {
                    if (daemonRunning) {
                        await fetch(`${BASE}/admin/daemon/stop`, {
                            method: "POST",
                        });
                        log($("admin-log"), "⏹️ Демон остановлен", "success");
                    } else {
                        await fetch(`${BASE}/admin/daemon/start?interval=60`, {
                            method: "POST",
                        });
                        log(
                            $("admin-log"),
                            "▶️ Демон запущен (интервал 60с)",
                            "success",
                        );
                    }
                    checkDaemonStatus();
                } catch (e) {
                    log($("admin-log"), `❌ Ошибка: ${e.message}`, "error");
                }
            }

            async function resummarizeAll() {
                const btn = document.querySelector(
                    'button[onclick="resummarizeAll()"]',
                );
                const logEl = $("admin-log");
                const orig = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = "⏳ Ресаммари...";
                log(logEl, "Суммаризация архивных сессий...", "info");

                try {
                    const r = await fetch(`${BASE}/admin/resummarize`, {
                        method: "POST",
                    });
                    const data = await r.json();
                    if (data.summarized > 0) {
                        log(
                            logEl,
                            `✅ ${data.summarized}/${data.processed} сессий ресаммаризировано` +
                                (data.errors.length
                                    ? ` (${data.errors.length} ошибок)`
                                    : ""),
                            "",
                        );
                    } else {
                        log(
                            logEl,
                            `⚠️ Обработано ${data.processed}, но ни одна сессия не имеет сообщений`,
                            "error",
                        );
                    }
                } catch (e) {
                    log(logEl, `❌ Ошибка: ${e.message}`, "error");
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = orig;
                }
            }

            async function resetDb() {
                // Защита от дурака — три подтверждения
                if (
                    !confirm(
                        "🗑️ ВЫ УВЕРЕНЫ? Это удалит ВСЕ сессии, сообщения и контексты из базы данных.\n\nМодель эмбеддингов (.model_cache) тоже будет удалена.",
                    )
                )
                    return;
                if (
                    !confirm(
                        "⚠️ ЭТО НЕОБРАТИМО.\n\nВсе данные будут безвозвратно удалены. Продолжить?",
                    )
                )
                    return;

                const btn = document.querySelector("button.danger");
                btn.disabled = true;
                btn.textContent = "⏳ Очистка...";
                try {
                    const r = await fetch(`${BASE}/admin/db-reset`, {
                        method: "POST",
                    });
                    if (!r.ok) throw new Error(await r.text());
                    const data = await r.json();
                    log(
                        $("admin-log"),
                        `✅ База очищена: ${data.sessions_deleted} сессий, ${data.messages_deleted} сообщений, ${data.contexts_deleted} контекстов` +
                            (data.cache_deleted ? " + кеш модели" : "") +
                            (data.sent_cache_cleared
                                ? " + сброшен sent-кеш"
                                : ""),
                        "success",
                    );
                    loadSessions();
                } catch (e) {
                    log($("admin-log"), `❌ Ошибка: ${e.message}`, "error");
                } finally {
                    btn.disabled = false;
                    btn.textContent = "🗑️ DB Reset";
                }
            }

            // ─── SEARCH ───────────────────────────────────────────

            function truncate(str, max = 300) {
                if (!str || str.length <= max) return str;
                return str.slice(0, max) + "...";
            }

            async function doSearch() {
                const query = $("search-query").value.trim();
                const project = $("search-project").value.trim();

                const params = new URLSearchParams({ query, limit: 10 });
                if (project) params.set("project", project);

                try {
                    const r = await fetch(`${BASE}/context/search?${params}`);
                    const data = await r.json();
                    const container = $("search-results");

                    if (data.results.length === 0) {
                        container.innerHTML =
                            '<div class="empty">Ничего не найдено</div>';
                        return;
                    }

                    const label = query
                        ? `Найдено: ${data.results.length} · запрос: "${data.query}"`
                        : `Последние контексты: ${data.results.length}`;
                    container.innerHTML = `<div style="font-size:13px;color:#8b949e;margin-bottom:12px">${label}</div>`;

                    data.results.forEach((res) => {
                        container.innerHTML += `
        <div class="result-item" id="ctx-${res.id}">
          <div style="display:flex;justify-content:space-between;align-items:start">
            <div class="meta">
              <span class="score">${(res.score * 100).toFixed(1)}%</span> совпадение
              ${res.summary ? `· ${res.summary}` : ""}
              <span class="badge project">${getProjectName(res.session_id)}</span>
            </div>
            <button class="btn-del" onclick="deleteContext('${res.id}')" title="Удалить">✕</button>
          </div>
          <div class="content">${escapeHtml(truncate(res.content, 500))}</div>
          ${
              res.keywords
                  ? `<div style="margin-top:6px">${res.keywords
                        .split(",")
                        .map((k) => `<span class="tag">${k.trim()}</span>`)
                        .join("")}</div>`
                  : ""
          }
        </div>`;
                    });

                    // Fetch project names
                    fetch(`${BASE}/sessions`)
                        .then((r) => r.json())
                        .then((data) => {
                            window._sessions = {};
                            data.sessions.forEach((s) => {
                                window._sessions[s.id] = s.project || "—";
                            });
                        });
                } catch (e) {
                    $("search-results").innerHTML =
                        `<div class="empty" style="color:#f85149">Ошибка: ${e.message}</div>`;
                }
            }

            function getProjectName(sessionId) {
                return window._sessions?.[sessionId] || "...";
            }

            async function deleteContext(ctxId) {
                if (!confirm("Удалить этот контекст?")) return;
                try {
                    const r = await fetch(`${BASE}/context/${ctxId}`, {
                        method: "DELETE",
                    });
                    if (r.ok) {
                        const el = document.getElementById(`ctx-${ctxId}`);
                        if (el) el.remove();
                    }
                } catch (e) {
                    alert(`Ошибка: ${e.message}`);
                }
            }

            async function archiveSession(sid) {
                if (
                    !confirm(
                        "Архивировать сессию? Все сообщения будут сконсолидированы в контекст.",
                    )
                )
                    return;
                try {
                    const r = await fetch(`${BASE}/sessions/${sid}/archive`, {
                        method: "POST",
                    });
                    if (r.ok) {
                        log(
                            $("sessions-list"),
                            "✅ Сессия архивирована",
                            "success",
                        );
                        loadSessions();
                    } else {
                        const err = await r.text();
                        alert(`Ошибка: ${err}`);
                    }
                } catch (e) {
                    alert(`Ошибка: ${e.message}`);
                }
            }

            async function deleteSession(sid) {
                if (!confirm("Удалить сессию и все её сообщения?")) return;
                try {
                    const r = await fetch(`${BASE}/sessions/${sid}`, {
                        method: "DELETE",
                    });
                    if (r.ok) {
                        const el = document.getElementById(`sess-${sid}`);
                        if (el) el.remove();
                    }
                } catch (e) {
                    alert(`Ошибка: ${e.message}`);
                }
            }

            // ─── SESSIONS ─────────────────────────────────────────

            async function loadSessions() {
                const project = $("sessions-filter").value.trim();
                const status = $("sessions-status").value;
                const params = new URLSearchParams({ limit: 50 });
                if (project) params.set("project", project);
                if (status) params.set("status", status);

                try {
                    const r = await fetch(`${BASE}/sessions?${params}`);
                    const data = await r.json();
                    const container = $("sessions-list");

                    if (data.sessions.length === 0) {
                        container.innerHTML =
                            '<div class="empty">Нет сессий</div>';
                        return;
                    }

                    container.innerHTML = `<div style="font-size:13px;color:#8b949e;margin-bottom:12px">Всего: ${data.total}</div>`;

                    data.sessions.forEach((s) => {
                        const statusIcon =
                            s.status === "archived" ? "📦" : "🟢";
                        container.innerHTML += `
        <div class="result-item" id="sess-${s.id}">
          <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="showSession('${s.id}')">
            <div style="flex:1;cursor:pointer" onclick="showSession('${s.id}')">
              <strong>${escapeHtml(s.title || "Без названия")}</strong>
              <span class="badge project">${escapeHtml(s.project || "—")}</span>
              <span style="font-size:12px;color:#8b949e;margin-left:12px">${s.message_count} сообщ. · ${new Date(s.updated_at).toLocaleDateString("ru")}</span>
              <span style="font-size:12px;margin-left:8px">${statusIcon} ${s.status}</span>
            </div>
            <div style="display:flex;gap:4px">
              ${s.status === "active" ? `<button class="secondary" style="font-size:12px;padding:4px 8px" onclick="event.stopPropagation();archiveSession('${s.id}')" title="Архивировать">📦</button>` : ""}
              <button class="btn-del" onclick="event.stopPropagation();deleteSession('${s.id}')" title="Удалить">✕</button>
            </div>
          </div>
        </div>`;
                    });
                } catch (e) {
                    $("sessions-list").innerHTML =
                        `<div class="empty" style="color:#f85149">Ошибка: ${e.message}</div>`;
                }
            }

            async function showSession(sid) {
                const r = await fetch(`${BASE}/messages/${sid}?limit=100`);
                const msgs = await r.json();
                const container = $("sessions-list");

                let html = `<button class="secondary" onclick="loadSessions()" style="margin-bottom:12px">← Назад</button>
    <div style="font-size:13px;color:#8b949e;margin-bottom:12px">Сообщений: ${msgs.length}</div>`;

                msgs.forEach((m) => {
                    const icon =
                        m.role === "user"
                            ? "👤"
                            : m.role === "assistant"
                              ? "🤖"
                              : "⚙️";
                    html += `
      <div class="result-item">
        <div class="meta">${icon} ${m.role} · ${new Date(m.created_at).toLocaleString("ru")}</div>
        <div class="content">${escapeHtml(m.content)}</div>
      </div>`;
                });
                container.innerHTML = html;
            }

            function escapeHtml(str) {
                const div = document.createElement("div");
                div.textContent = str;
                return div.innerHTML;
            }

            // ─── JUNK (raw Zed threads) ──────────────────────────────

            function formatBytes(bytes) {
                if (!bytes || bytes === 0) return "0 B";
                const units = ["B", "KB", "MB", "GB"];
                let i = 0;
                let size = bytes;
                while (size >= 1024 && i < units.length - 1) {
                    size /= 1024;
                    i++;
                }
                return size.toFixed(1) + " " + units[i];
            }

            function formatDate(str) {
                if (!str) return "—";
                return new Date(str).toLocaleDateString("ru");
            }

            let _junkThreads = [];

            async function loadJunk() {
                const project = $("junk-filter").value.trim().toLowerCase();
                const status = $("junk-status").value;
                const container = $("junk-list");

                try {
                    const r = await fetch(`${BASE}/admin/zed-threads`);
                    const data = await r.json();
                    _junkThreads = data.threads;

                    // Stats bar
                    let statsHtml = `${data.total} тредов · ${data.total_messages} сообщ. · `;
                    statsHtml += `${data.archived_count}📦 ${data.active_count}🟢 · `;
                    statsHtml += `${formatBytes(data.total_compressed_mb * 1024 * 1024)} сжато`;
                    if (data.total_decompressed_mb) {
                        statsHtml += ` → ${formatBytes(data.total_decompressed_mb * 1024 * 1024)} распаковано`;
                    }
                    $("junk-stats").textContent = statsHtml;

                    // Filter
                    let filtered = _junkThreads;
                    if (project) {
                        filtered = filtered.filter((t) =>
                            t.project.toLowerCase().includes(project),
                        );
                    }
                    if (status === "archived") {
                        filtered = filtered.filter((t) => t.archived);
                    } else if (status === "active") {
                        filtered = filtered.filter((t) => !t.archived);
                    } else if (status === "broken") {
                        filtered = filtered.filter((t) => t.error);
                    }

                    if (filtered.length === 0) {
                        container.innerHTML =
                            '<div class="empty">Нет тредов</div>';
                        return;
                    }

                    container.innerHTML = `<div style="font-size:13px;color:#8b949e;margin-bottom:12px">Показано: ${filtered.length} из ${data.total}</div>`;

                    filtered.forEach((t) => {
                        const statusIcon = t.archived ? "📦" : "🟢";
                        const errorBadge = t.error
                            ? `<span class="badge" style="background:#da3633;color:#fff" title="${escapeHtml(t.error)}">💥</span>`
                            : "";
                        const sizeInfo =
                            `${formatBytes(t.compressed_bytes)}` +
                            (t.decompressed_bytes
                                ? ` → ${formatBytes(t.decompressed_bytes)}`
                                : "");

                        container.innerHTML += `
        <div class="result-item" id="junk-${t.id}">
          <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="showJunkThread('${t.id}')">
            <div style="flex:1;cursor:pointer" onclick="showJunkThread('${t.id}')">
              <strong>${escapeHtml(t.title || "(без названия)")}</strong>
              <span class="badge project">${escapeHtml(t.project)}</span>
              <span style="font-size:12px;color:#8b949e;margin-left:12px">${t.message_count} сообщ.</span>
              <span style="font-size:12px;color:#8b949e;margin-left:8px">${sizeInfo}</span>
              <span style="font-size:12px;margin-left:8px">${statusIcon}</span>
              ${errorBadge}
            </div>
          </div>
        </div>`;
                    });
                } catch (e) {
                    container.innerHTML = `<div class="empty" style="color:#f85149">Ошибка: ${e.message}</div>`;
                }
            }

            async function showJunkThread(sid) {
                // Find thread data
                const t = _junkThreads.find((x) => x.id === sid);
                if (!t) return;
                const container = $("junk-list");

                let html = `<button class="secondary" onclick="loadJunk()" style="margin-bottom:12px">← Назад</button>
    <div style="font-size:13px;color:#8b949e;margin-bottom:12px">
      <strong>${escapeHtml(t.title || "(без названия)")}</strong>
      <span class="badge project">${escapeHtml(t.project)}</span>
      · ${t.message_count} сырых сообщ. · ${formatBytes(t.compressed_bytes)}
      ${t.error ? `· 💥 ${escapeHtml(t.error)}` : ""}
    </div>
    <div style="font-size:12px;color:#8b949e;margin-bottom:12px">⚠️ Показаны СЫРЫЕ данные из Zed, включая Thinking, ToolUse и прочий мусор</div>`;

                if (t.error) {
                    html += `<div class="result-item"><div class="content" style="color:#f85149">⚠️ Данные не разжаты: ${escapeHtml(t.error)}</div></div>`;
                    container.innerHTML = html;
                    return;
                }

                // Fetch RAW messages directly from Zed via the backend
                try {
                    const r = await fetch(
                        `${BASE}/admin/zed-threads/${sid}/messages`,
                    );
                    if (r.ok) {
                        const data = await r.json();
                        const msgs = data.messages;
                        html += `<div style="font-size:13px;color:#8b949e;margin-bottom:12px">Сырых сообщений из Zed: ${msgs.length}</div>`;

                        // Check if synced in CacheProxy too
                        try {
                            const r2 = await fetch(
                                `${BASE}/messages/${sid}?limit=1`,
                            );
                            if (r2.ok) {
                                html += `<div style="font-size:13px;color:#2ea043;margin-bottom:12px">✅ Этот тред есть в CacheProxy (с фильтрацией)</div>`;
                            } else {
                                html += `<div class="result-item">
                                  <div class="content" style="color:#8b949e;margin-bottom:8px">⏳ В CacheProxy отсутствует</div>
                                  <button onclick="syncJunkThread('${sid}')" style="font-size:13px">📥 Синхронизировать в CacheProxy</button>
                                  <span id="junk-sync-status-${sid}" style="font-size:12px;color:#8b949e;margin-left:8px"></span>
                                </div>`;
                            }
                        } catch (e) {}

                        msgs.forEach((m, i) => {
                            const icon =
                                m.role === "user"
                                    ? "👤"
                                    : m.role === "assistant"
                                      ? "🤖"
                                      : "⚙️";
                            const blocks = m.blocks ? m.blocks.join(" | ") : "";
                            html += `
      <div class="result-item">
        <div class="meta">${icon} ${m.role} · #${i + 1} ${blocks ? `· [${escapeHtml(blocks)}]` : ""}</div>
        <div class="content" style="${m.has_thinking ? "border-left:3px solid #d29922;padding-left:8px" : ""}">${escapeHtml(m.content)}</div>
      </div>`;
                        });
                    } else {
                        const errData = await r.json();
                        html += `<div class="result-item">
                          <div class="content" style="color:#8b949e;margin-bottom:8px">⏳ Этот тред не синхронизирован в CacheProxy</div>
                          <button onclick="syncJunkThread('${sid}')" style="font-size:13px">📥 Синхронизировать в CacheProxy</button>
                          <span id="junk-sync-status-${sid}" style="font-size:12px;color:#8b949e;margin-left:8px"></span>
                        </div>`;
                    }
                } catch (e) {
                    html += `<div class="result-item"><div class="content" style="color:#f85149">⚠️ Ошибка: ${escapeHtml(e.message)}</div></div>`;
                }

                container.innerHTML = html;
            }

            async function syncJunkThread(sid) {
                const btn = document.querySelector(
                    `button[onclick="syncJunkThread('${sid}')"]`,
                );
                const statusEl = $(`junk-sync-status-${sid}`);
                if (btn) {
                    btn.disabled = true;
                    btn.textContent = "⏳ Синхронизация...";
                }
                statusEl.textContent = "⏳";
                try {
                    const r = await fetch(
                        `${BASE}/admin/zed-threads/${sid}/sync`,
                        { method: "POST" },
                    );
                    const data = await r.json();
                    if (r.ok) {
                        statusEl.textContent = `✅ Синхронизировано (${data.messages} сообщ.)`;
                        if (btn) btn.textContent = "✅ Готово";
                    } else {
                        statusEl.textContent = `❌ ${data.detail || "Ошибка"}`;
                        if (btn) {
                            btn.disabled = false;
                            btn.textContent =
                                "📥 Синхронизировать в CacheProxy";
                        }
                    }
                } catch (e) {
                    statusEl.textContent = `❌ ${e.message}`;
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = "📥 Синхронизировать в CacheProxy";
                    }
                }
            }

            // Init: load sessions + projects + daemon status
            setTimeout(() => {
                loadSessions();
                loadProjects();
                checkDaemonStatus();
            }, 500);

            // Fetch project names for search
            fetch(`${BASE}/sessions`)
                .then((r) => r.json())
                .then((data) => {
                    window._sessions = {};
                    data.sessions.forEach((s) => {
                        window._sessions[s.id] = s.project || "—";
                    });
                })
                .catch(() => {});
        </script>
    </body>
</html>
